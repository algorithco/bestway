name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: education_center
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/education_center?schema=public
      PORT: 3001
      JWT_SECRET: ci-test-jwt-secret-0123456789abcdef
      STREAM_TOKEN_SECRET: ci-test-stream-secret-0123456789ab
      CORS_ORIGIN: http://localhost:3005
      SMOKE_BASE_URL: http://localhost:3001/v1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma migrate deploy
        run: npx prisma migrate deploy
      - name: Seed demo data
        # test:smoke logs in as demo users (super_admin/admin/teacher/...)
        # which only exist after the demo seed — seed defaults match CI env.
        run: npm run seed
      - name: Build
        run: npm run build
      - name: Smoke test (built app)
        run: |
          npm run start:prod &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/v1/health; then
              echo "backend healthy"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "backend did not become healthy in time"
              kill "$(cat /tmp/backend.pid)" || true
              exit 1
            fi
            sleep 2
          done
          npm run test:smoke
          kill "$(cat /tmp/backend.pid)"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.13.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
