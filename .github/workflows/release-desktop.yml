# Release the Tauri desktop app as `bestway-app vX.Y.Z`.
#
# How to release:
#   1. Bump version in bestway-tauri/package.json,
#      bestway-tauri/src-tauri/tauri.conf.json and
#      bestway-tauri/src-tauri/Cargo.toml (keep all three in sync).
#   2. Commit, then tag:  git tag bestway-app-v0.1.0
#   3. Push the tag:      git push origin bestway-app-v0.1.0
# CI builds Windows (.exe/.msi via nsis), macOS (.dmg) and
# Linux (.AppImage/.deb) and attaches them to the GitHub Release
# named `bestway-app vX.Y.Z`.
name: Release Desktop (bestway-app)

on:
  push:
    tags:
      - "bestway-app-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bestway-tauri/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: bestway-tauri/src-tauri -> target

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf \
            libssl-dev libxdo-dev

      - name: Install frontend deps
        working-directory: bestway-tauri
        run: npm ci

      - name: Build + Release
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: bestway-tauri
          tagName: ${{ github.ref_name }}
          releaseName: "bestway-app ${{ github.ref_name }}"
          releaseBody: "Student lockdown exam client (Tauri v2). Pick your OS installer below."
          releaseDraft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
