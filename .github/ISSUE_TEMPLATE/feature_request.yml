name: Feature request
description: Suggest a new feature or improvement for BESTWAY.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. Keep it scoped to one module if possible.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: Who needs this (student/teacher/admin/parent) and why?
      placeholder: As a teacher I want ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add ... to /points with ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - backend
        - frontend
        - docs
        - infra
