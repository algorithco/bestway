# Backend API: https://api.bestwayec.uz
# Cloudflare Full (strict) variant — REPLACES nginx/api.bestwayec.uz.conf on the VPS.
# Original kept in repo for reference; install THIS file on Cloudflare-fronted servers.
#
# Prerequisites: same Origin CA cert as frontend
# (/etc/nginx/ssl/cf-origin.pem + key, Full (strict) mode, A api → VPS_IP orange cloud).
# Install: sudo cp nginx/api.bestwayec.uz.cf-origin.conf /etc/nginx/sites-available/api.bestwayec.uz
#          sudo ln -s /etc/nginx/sites-available/api.bestwayec.uz /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Limits (Cloudflare Free, verified Oct 2026):
#   - Max proxied upload 100MB → client_max_body_size 100m (large videos use direct-api host).
#   - Proxy Read Timeout 125s / Write 30s at Cloudflare → Nginx timeouts kept inside those.

server {
    listen 80;
    server_name api.bestwayec.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.bestwayec.uz;

    ssl_certificate /etc/nginx/ssl/cf-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cf-origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # keep streaming behaviour for video playback (Range requests)
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }
}
