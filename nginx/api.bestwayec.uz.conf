# Backend API: https://api.bestwayec.uz
# Install: sudo cp nginx/api.bestwayec.uz.conf /etc/nginx/sites-available/api.bestwayec.uz
#          sudo ln -s /etc/nginx/sites-available/api.bestwayec.uz /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# SSL: sudo certbot --nginx -d api.bestwayec.uz
server {
    listen 80;
    server_name api.bestwayec.uz;

    client_max_body_size 520m;   # for video uploads (MAX_UPLOAD_MB=500)

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # disable buffering for video streaming (Range requests)
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
