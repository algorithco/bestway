# Large-upload bypass: https://direct-api.bestwayec.uz
# DNS-ONLY (grey cloud) hostname — traffic goes straight to the VPS, skipping
# Cloudflare's 100MB / 125s proxy limits. Serves the SAME NestJS backend.
#
# DNS (Cloudflare dashboard): A direct-api → VPS_IP, Proxy status OFF (grey).
# TLS: publicly-trusted cert REQUIRED here (Origin CA will NOT validate in browsers).
#   sudo certbot --nginx -d direct-api.bestwayec.uz
#   (keep auto-renew: systemctl status certbot.timer)
# Install: sudo cp nginx/direct-api.bestwayec.uz.conf /etc/nginx/sites-available/direct-api.bestwayec.uz
#          sudo ln -s /etc/nginx/sites-available/direct-api.bestwayec.uz /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# SECURITY — grey cloud exposes the origin IP and skips WAF/rate-limit at Cloudflare:
#   1. Use an obscure hostname (this one is fine — never link it publicly).
#   2. Backend auth (JWT) is still enforced — this vhost adds no anonymous surface.
#   3. Tighten further with Nginx rate limiting below (10 req/s burst 20 per IP).
#   4. Never CNAME-share this IP with mail/MX. If the IP leaks via history, rotate it.
# LONG-TERM: replace with chunked/tus or R2 presigned uploads (each request <100MB),
# then this bypass can be retired. See docs/vps-cloudflare-runbook.md.

limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/s;

server {
    listen 80;
    server_name direct-api.bestwayec.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name direct-api.bestwayec.uz;

    # Let's Encrypt (managed by certbot) — NOT the Cloudflare Origin cert.
    ssl_certificate /etc/letsencrypt/live/direct-api.bestwayec.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/direct-api.bestwayec.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Full 500MB video payload allowed here only (backend MAX_UPLOAD_MB=500).
    client_max_body_size 520m;
    client_body_timeout 600s;
    client_header_timeout 60s;

    limit_req zone=upload_limit burst=20 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffering off;
        proxy_request_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;
    }
}
