<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin panel — BESTWAY EC</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
</head>
<body>

<!-- Kirish -->
<section id="login">
  <div class="card">
    <div class="logo">
      <b id="loginCenter">O'quv markaz</b>
      <div>Admin panel</div>
    </div>
    <form id="loginForm">
      <div class="field">
        <label for="phone">Telefon raqam</label>
        <input id="phone" type="tel" placeholder="+998901234567" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Parol</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="error" id="loginError"></p>
      <button class="primary" type="submit" style="width:100%">Kirish</button>
    </form>
  </div>
</section>

<!-- Panel -->
<div id="app">
  <aside>
    <div class="brand">
      <b id="brandName">BESTWAY EC</b>
      <div>Boshqaruv paneli</div>
    </div>
    <nav id="nav"></nav>
    <div class="me">
      <div id="meName"></div>
      <div id="meRole"></div>
      <button class="small" id="logoutBtn" style="margin-top:8px;width:100%">Chiqish</button>
    </div>
  </aside>
  <main id="view"></main>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<script src="app.js"></script>
</body>
</html>
